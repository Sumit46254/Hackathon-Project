<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Worker Management Portal - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-info">

            <div class="logo">
                Worker<span>Portal</span>
            </div>

            <h1>Worker Management Portal</h1>

            <p>
                Manage employees, attendance, salary
                and leave from one place.
            </p>

            <div class="features">

                <p>✓ Employee Management</p>
                <p>✓ Attendance Management</p>
                <p>✓ Salary Management</p>
            </div>

        </div>


        <div class="login-box">

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Select your account type to continue
            </p>

            <div class="role-selection">

                <button
                    class="role-btn active"
                    id="workerRole">

                    👷
                    <span>Worker</span>

                </button>


                <button
                    class="role-btn"
                    id="adminRole">

                    👨‍💼
                    <span>Admin</span>

                </button>

            </div>

            <form id="loginForm">

                <label id="idLabel">
                    Worker ID
                </label>

                <input
                    type="text"
                    id="userId"
                    placeholder="Enter Worker ID"
                    required>

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required>

                <p id="errorMessage" class="error-message"></p>


                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>

            </form>


            <p class="demo-text">
                Demo login credentials are given below.
            </p>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
