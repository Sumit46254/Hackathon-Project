<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Employee Portal - Login</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">
    <h2 class="heading">Employee Portal</h2>
    <div class="card">
      <h2>Login</h2>
      <form id="loginForm">
        <div class="field">
          <label for="username">User Name</label>
          <input type="text" id="username" placeholder="Enter user name" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required />
        </div>

        <div class="row">
          <label>
            <input type="checkbox" id="remember" />
            Remember me
          </label>
          <a href="#" id="forgotPassword">Forgot password?</a>
        </div>
        <button type="submit" onclick="window.location.href='../dash.html'">Login</button>
        <p class="error" id="errorMsg">Invalid username or password.</p>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
